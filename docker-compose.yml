name: clothing_store_backend

services:
  # ─── PostgreSQL Database ───────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: clothing_store-postgres
    # Optional local DB. The app uses the external database from .env by default;
    # start this one with: docker compose --profile local-db up -d
    profiles: ["local-db"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clothing_store}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password_123}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-clothing_store}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - clothing_network

  # ─── Redis (Cache & Task Queue) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clothing_store-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password_123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clothing_network

  # ─── MinIO Object Storage (S3 API & Web Console) ───────────────────────────
  minio:
    image: minio/minio:latest
    container_name: clothing_store-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Web Console
    networks:
      - clothing_network

  # ─── Backend API (FastAPI) ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing_store-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
    volumes:
      - .:/app
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - clothing_network

  # ─── Celery Background Worker ──────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing_store-celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: minio:9000
    volumes:
      - .:/app
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    networks:
      - clothing_network

  # ─── Celery Periodic Task Scheduler (Beat) ─────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing_store-celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
    depends_on:
      - celery_worker
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - clothing_network

volumes:
  postgres_data:
    name: clothing_store_postgres_data
  redis_data:
    name: clothing_store_redis_data
  minio_data:
    name: clothing_store_minio_data
  uploads:
    name: clothing_store_uploads

networks:
  clothing_network:
    name: clothing_store_net
    driver: bridge

