name: clothing_store_backend

services:
  # ─── Redis (Cache & Task Queue) ────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: clothing_store-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secure_password_123}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secure_password_123}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - clothing_network

  # ─── Backend API (FastAPI) ─────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing_store-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - uploads:/app/uploads
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - clothing_network

  # ─── Celery Background Worker ──────────────────────────────────────────────
  celery_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing_store-celery_worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
      - uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --concurrency=4
    networks:
      - clothing_network

  # ─── Celery Periodic Task Scheduler (Beat) ─────────────────────────────────
  celery_beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: clothing_store-celery_beat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    volumes:
      - .:/app
    depends_on:
      - celery_worker
    command: celery -A app.tasks.celery_app beat --loglevel=info
    networks:
      - clothing_network

volumes:
  redis_data:
    name: clothing_store_redis_data
  uploads:
    name: clothing_store_uploads

networks:
  clothing_network:
    name: clothing_store_net
    driver: bridge

